name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/local-service/go.mod
          cache: true
          cache-dependency-path: services/local-service/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make check test-scripts test-contract test-web test-service test-fuzz test-lifecycle
      - name: Run production browser acceptance
        run: |
          browser_binary="$(command -v google-chrome || command -v chromium)"
          COVE_BROWSER_BIN="$browser_binary" make test-web-browser
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cove-browser-acceptance
          path: .artifacts/frontend-acceptance/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - run: pnpm audit --audit-level moderate

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/local-service/go.mod
          cache: true
          cache-dependency-path: services/local-service/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Test macOS launcher
        run: make test-macos
      - name: Build and verify macOS DMG
        env:
          COVE_INSECURE_FILE_SECRET_STORE: "1"
        run: make dmg
      - name: Verify test Secret Store is enabled
        run: test "$(plutil -extract CoveInsecureFileSecretStore raw -o - .artifacts/Cove.app/Contents/Info.plist)" = "true"
      - name: Run macOS package acceptance test
        run: make test-package-macos
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cove-macos-pr
          path: |
            .artifacts/Cove-*.dmg
            .artifacts/Cove-*.dmg.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
