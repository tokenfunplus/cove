name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/local-service/go.mod
          cache: true
          cache-dependency-path: services/local-service/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make check test-scripts test-contract test-web test-service test-lifecycle
      - run: pnpm audit --audit-level moderate

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/local-service/go.mod
          cache: true
          cache-dependency-path: services/local-service/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Test macOS launcher
        run: make test-macos
      - name: Build and verify macOS DMG
        env:
          COVE_INSECURE_FILE_SECRET_STORE: "1"
        run: make dmg
      - name: Verify test Secret Store is enabled
        run: test "$(plutil -extract CoveInsecureFileSecretStore raw -o - .artifacts/Cove.app/Contents/Info.plist)" = "true"
      - name: Run macOS package acceptance test
        run: make test-package-macos
      - uses: actions/upload-artifact@v4
        with:
          name: cove-macos-pr
          path: |
            .artifacts/Cove-*.dmg
            .artifacts/Cove-*.dmg.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
