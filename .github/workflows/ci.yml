name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/local-service/go.mod
          cache: true
          cache-dependency-path: services/local-service/go.sum
      - run: pnpm install --frozen-lockfile
      - run: make check test-scripts test-contract test-web test-service test-fuzz test-lifecycle
        env:
          # Use an execution budget to avoid Go's timed fuzz shutdown race.
          FUZZ_TIME: 100000x
      - name: Run production browser acceptance
        run: |
          browser_binary="$(command -v google-chrome || command -v chromium)"
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" make test-web-browser
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=debate-focus COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/debate-focus node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=history COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/history node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=projects COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/projects node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=interactive COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/interactive node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=local-capabilities COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/local-capabilities node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=mini-apps COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/mini-apps node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=mini-app-turn COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/mini-app-turn node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=mini-app-dialogs COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/mini-app-dialogs node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=mini-app-scroll-history COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/mini-app-scroll-history node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=debate-controls COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/debate-controls node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=web-sources COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/web-sources node apps/web/e2e/acceptance.mjs
          dbus-run-session -- env COVE_BROWSER_BIN="$browser_binary" COVE_BROWSER_SCENARIO=web-search COVE_BROWSER_ARTIFACT_DIR=.artifacts/frontend-acceptance/web-search node apps/web/e2e/acceptance.mjs
      - name: Upload browser acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cove-browser-acceptance
          path: .artifacts/frontend-acceptance/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
      - name: Audit dependencies and verify the local picomatch security patch
        run: pnpm run audit:dependencies

  package-macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.11.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: services/local-service/go.mod
          cache: true
          cache-dependency-path: services/local-service/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Test macOS launcher
        run: make test-macos
      - name: Install pinned DMG build tools
        run: |
          python3 -m venv .artifacts/dmg-tools
          .artifacts/dmg-tools/bin/python -m pip install -r scripts/dmg-requirements.txt
      - name: Test DMG layout and damaged-app rejection
        run: make test-dmg
      - name: Build and verify macOS DMG
        env:
          COVE_INSECURE_FILE_SECRET_STORE: "1"
        run: make dmg
      - name: Test Mini App Launcher intents and private picker transport
        run: |
          test "$(plutil -extract CFBundleURLTypes.0.CFBundleURLSchemes.0 raw -o - .artifacts/Cove.app/Contents/Info.plist)" = "cove"
          scripts/native/test-mini-apps.sh .artifacts/Cove.app/Contents/Resources/cove-local-service --os-handoff
          scripts/native/test-mini-app-compatible.sh .artifacts/Cove.app/Contents/Resources/cove-local-service
      - name: Verify test Secret Store is enabled
        run: test "$(plutil -extract CoveInsecureFileSecretStore raw -o - .artifacts/Cove.app/Contents/Info.plist)" = "true"
      - name: Run macOS package acceptance test
        run: make test-package-macos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cove-macos-pr
          path: |
            .artifacts/Cove-*.dmg
            .artifacts/Cove-*.dmg.sha256
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
